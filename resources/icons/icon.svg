<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <!-- Hintergrund -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Twitch-lila Akzentbalken oben -->
  <rect x="80" y="60" width="352" height="12" rx="6" fill="#9146ff"/>
  <!-- Controller-Silhouette (vereinfacht) -->
  <path d="M120 220 Q100 200 90 230 L80 290 Q78 320 110 330 L160 330 L185 360 L210 330 L300 330 L325 360 L350 330 L400 330 Q432 320 430 290 L420 230 Q410 200 390 220 L350 220 Q330 200 256 200 Q182 200 162 220 Z"
        fill="#2a2a4a" stroke="#9146ff" stroke-width="6"/>
  <!-- D-Pad -->
  <rect x="140" y="248" width="14" height="40" rx="3" fill="#9146ff"/>
  <rect x="122" y="266" width="50" height="14" rx="3" fill="#9146ff"/>
  <!-- ABXY Buttons -->
  <circle cx="355" cy="268" r="9" fill="#1db954"/>
  <circle cx="377" cy="250" r="9" fill="#e74c3c"/>
  <circle cx="333" cy="250" r="9" fill="#3498db"/>
  <circle cx="355" cy="232" r="9" fill="#f39c12"/>
  <!-- Steam Deck Symbol (kleines D-Pad-förmiges Logo) in der Mitte -->
  <circle cx="256" cy="270" r="18" fill="none" stroke="#9146ff" stroke-width="5"/>
  <circle cx="256" cy="270" r="8" fill="#9146ff"/>
  <!-- Twitch-Wortmarke-Ersatz: "T4SD" -->
  <text x="256" y="420" text-anchor="middle"
        font-family="monospace, sans-serif" font-size="52" font-weight="bold"
        fill="#9146ff" letter-spacing="4">T4SD</text>
</svg>
