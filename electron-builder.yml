appId: tv.twitch4steamdeck.App
productName: Twitch4SteamDeck
copyright: Copyright © 2026 twitch4steamdeck
directories:
  buildResources: resources
  output: dist
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  - "!{.eslintrc,.prettierrc,.gitignore}"
linux:
  target:
    - AppImage
  category: AudioVideo
  synopsis: Ad-free Twitch client for Steam Deck
  description: Big-screen Twitch client with ad-free live and VOD playback, gamepad navigation, and local VOD history.
